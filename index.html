<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sürpriz!</title>
    <style>
        body {
            background-color: #222;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
        }
        button {
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background-color: #ff4757;
            color: white;
            font-weight: bold;
        }
        img {
            max-width: 300px;
            width: 80%;
            display: none;
            margin-top: 20px;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <h2>Tebrikler! Ödül Kazandınız 🎉</h2>
    <p>Ödülü almak için aşağıdaki butona tıklayın:</p>
    <button onclick="moo()">Tıkla ve Gör</button>

    <img id="cowImg" src="https://m.media-amazon.com/images/I/71cQ11E9qAL._AC_SL1500_.jpg" alt="İnek">

    <script>
        function moo() {
            // Ekrana inek resmini getir
            document.getElementById('cowImg').style.display = 'block';

            // Sesli mesajı hazırla ve seslendir
            let text = "Mal Yasemin her şeye inanma! Möööööööö!";
            let utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = "tr-TR";
            utterance.pitch = 0.6; // Ses tonu
            utterance.rate = 0.85; // Konuşma hızı
            
            window.speechSynthesis.speak(utterance);
        }
    </script>

</body>
</html>
